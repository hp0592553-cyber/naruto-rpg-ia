name: Bushin isolated browser controls test
on:
  push:
    branches: [main]
    paths:
      - test_live_browser.py
      - .github/workflows/bushin-controls-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install chromium --with-deps
      - name: Real Chromium click, typing, scroll and JPEG
        run: python test_live_browser.py
