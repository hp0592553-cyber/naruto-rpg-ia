name: Bushin Worker checks
on:
  workflow_dispatch:
  push:
    branches: [Projeto]
    paths: ['cloudflare/**', 'scripts/command_service.py', 'scripts/opencode_planner.py', 'scripts/test_command_service.py', 'tests/test_opencode_planner.py', '.github/workflows/cloudflare-tests.yml']
  pull_request:
    paths: ['cloudflare/**', '.github/workflows/cloudflare-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test cloudflare/tests/*.test.mjs
      - name: Verificar sintaxe da ponte Codex CLI
        run: python3 -m py_compile scripts/codex_bridge.py
      - name: Verificar cancelamento e presença do executor sem Discord
        run: |
          python3 -m py_compile scripts/command_service.py scripts/naruto_guarded_mcp.py scripts/opencode_planner.py
          python3 -m unittest discover -s scripts -p 'test_command_service.py'

      - name: Verificar interpretação dos planos do OpenCode
        run: python3 -m unittest discover -s tests -p 'test_opencode_planner.py'
