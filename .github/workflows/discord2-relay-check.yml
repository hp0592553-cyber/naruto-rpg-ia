name: Discord 2 private delivery check
on:
  push:
    branches: [Projeto]
    paths: ['.github/workflows/discord2-relay-check.yml']
permissions:
  contents: read
  id-token: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify private delivery without Discord actions
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          endpoint='https://bushin-discord-direct.henrique-silva081106.workers.dev/internal/discord2-result'
          request=urllib.request.Request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']+'&audience='+urllib.parse.quote(endpoint,safe=''),headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request,timeout=15) as handle:
              token=json.load(handle)['value']
          request=urllib.request.Request(endpoint,data=b'{"probe":true}',headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},method='POST')
          try:
              with urllib.request.urlopen(request,timeout=25) as handle:
                  result=json.load(handle)
              stage=result.get('stage','unknown')
              print(json.dumps({'relay_probe':stage,'discord_action_sent':False}))
              raise SystemExit(0 if stage=='ready' else 1)
          except urllib.error.HTTPError as exc:
              try: stage=json.load(exc).get('stage','unknown')
              except Exception: stage='http_response'
              if stage not in {'method','identity','signing_keys','signature','payload','request_correlation','workflow_correlation','response_validation','encrypted_storage','run_access'}: stage='unknown'
              print(json.dumps({'relay_probe':stage,'http_status':exc.code,'discord_action_sent':False}))
              raise SystemExit(1)
          PY
