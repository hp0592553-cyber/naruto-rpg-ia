name: Naruto RPG - OpenCode (Projeto)

on:
  push:
    branches: [Projeto]
    paths:
      - .github/workflows/opencode-projeto.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: naruto-rpg-opencode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jogar:
    name: Tentar uma acao no Naruto Project
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar branch Projeto
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compilar MCP do projeto
        run: python3 -m py_compile scripts/naruto_guarded_mcp.py

      - name: Instalar Python e OpenCode
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar ferramentas do projeto
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          npm install --global opencode-ai
          opencode --version

      - name: Registrar MCP restrito no OpenCode
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          config = {
              "$schema": "https://opencode.ai/config.json",
              "permission": {
                  "bash": "deny",
                  "edit": "deny",
                  "write": "deny",
                  "webfetch": "deny",
                  "websearch": "deny",
                  "external_directory": "deny"
              },
              "mcp": {
                  "naruto": {
                      "type": "local",
                      "command": ["python3", "scripts/naruto_guarded_mcp.py"],
                      "enabled": True,
                      "timeout": 60000
                  }
              }
          }
          dest = Path.home() / ".config" / "opencode" / "opencode.json"
          dest.write_text(json.dumps(config), encoding="utf-8")
          PY

      - name: OpenCode tenta consultar missoes do Naruto Project
        shell: bash
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_USER_TOKEN }}
          RPG_MODE: jogar
          RPG_AUDIT_PATH: ${{ runner.temp }}/naruto-audit.jsonl
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_TOKEN" ]]; then
            echo "::error::Secret DISCORD_USER_TOKEN ausente ou vazio."
            exit 1
          fi
          cat > "$RUNNER_TEMP/tarefa.txt" <<'PROMPT'
          Objetivo: tentar UMA acao real e verificavel do personagem Henrique Uchiha
          no Naruto Project, nunca no Full Power ou Retsuden.
          Acesse SOMENTE as ferramentas MCP naruto (nao use bash nem outras ferramentas).
          1. Chame naruto_status_rpg para verificar a conexao ao servidor.
          2. Leia ate 12 mensagens no canal 1520114348079583263 com naruto_read_messages.
          3. Consulte naruto_list_application_commands no mesmo canal.
          4. Se a conexao, canal e comando estiverem disponiveis, use UMA UNICA VEZ
             naruto_send_slash_command com:
             channel_id = 1520114348079583263
             application_id = 1515908078913192026
             command_name = "missoes minhas"
             options = {}
          5. Leia a resposta em naruto_list_ephemeral_messages e naruto_read_messages.
          6. Relate se a chamada ocorreu e SE houve resposta confirmada.
          Nao tente outros comandos ou envie mensagens a pessoas.
          Nao repita a acao diante de erro, atraso ou resposta incompleta.
          Nao leia nem exiba tokens, segredos, arquivos .env ou configuracao de conta.
          Nao invente resultados, niveis, recompensas nem XP.
          PROMPT
          opencode run --agent build --model opencode/big-pickle "$(cat "$RUNNER_TEMP/tarefa.txt")" > relatorio-naruto.md
          test -s relatorio-naruto.md

      - name: Conferir chamadas registradas
        shell: bash
        if: always()
        env:
          RPG_AUDIT_PATH: ${{ runner.temp }}/naruto-audit.jsonl
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RPG_AUDIT_PATH"])
          if not path.is_file():
              print("Nao houve registro de conexao ao MCP.")
              raise SystemExit(0)
          calls = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          for item in calls:
              print(f"{item['tool']}: {item['outcome']}")
          print("Envio nao comprova resposta do Naruto Bot ou ganho de XP.")
          PY

      - name: Publicar auditoria e relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-jogada-tentativa
          if-no-files-found: warn
          retention-days: 3
          path: |
            relatorio-naruto.md
            ${{ runner.temp }}/naruto-audit.jsonl
