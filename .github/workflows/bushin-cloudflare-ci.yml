name: Bushin - Cloudflare CI e deploy controlado

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Para publicar, digite PUBLICAR; deixe vazio para apenas testar'
        required: false
        default: ''
        type: string
  push:
    branches: [Projeto]
    paths:
      - 'cloudflare/**'
      - 'scripts/export-discord2-html.mjs'
      - 'scripts/verify-bushin-ci.mjs'
      - '.github/workflows/bushin-cloudflare-ci.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'scripts/export-discord2-html.mjs'
      - 'scripts/verify-bushin-ci.mjs'
      - '.github/workflows/bushin-cloudflare-ci.yml'

permissions:
  contents: read

concurrency:
  group: bushin-cloudflare-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar sintaxe de todos os modulos Cloudflare
        run: |
          set -eu
          for file in cloudflare/*.mjs; do node --check "$file"; done
      - name: Verificar bindings, imports, interface e seguranca do projeto
        run: node scripts/verify-bushin-ci.mjs
      - name: Testar comportamento do Bushin com mocks (sem Discord real)
        run: node --test cloudflare/tests/*.test.mjs
      - name: Exportar HTML real do Discord 2
        run: node scripts/export-discord2-html.mjs dist/discord2
      - name: Verificar JavaScript exportado
        run: node --check dist/discord2/app.js
      - name: Compilar Worker em modo dry-run (sem publicar)
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.jsonc --dry-run --outdir dist/worker-build
      - name: Guardar HTML e build para diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bushin-cloudflare-ci
          path: |
            dist/discord2/
            dist/worker-build/
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: Publicar somente com confirmacao manual
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == 'PUBLICAR' && github.ref == 'refs/heads/Projeto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Confirmar credenciais do GitHub Secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" || { echo "::error::Configure CLOUDFLARE_API_TOKEN nos Secrets do repositorio"; exit 1; }
          test -n "$CF_ACCOUNT_ID" || { echo "::error::Configure CLOUDFLARE_ACCOUNT_ID nos Secrets do repositorio"; exit 1; }
      - name: Publicar Worker existente preservando Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config cloudflare/wrangler.jsonc --keep-vars
      - name: Conferir HTTP do painel sem autenticar ou enviar comandos
        run: |
          curl --fail --silent --show-error --location --retry 2 \
            --output /dev/null \
            --write-out 'Discord 2 HTTP %{http_code}\n' \
            'https://bushin-discord-direct.henrique-silva081106.workers.dev/mobile/discord2'
